<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LumoVibe</title>
  <meta name="description" content="Трек из LumoVibe — бесплатного музыкального плеера Tiny Tide">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/projects/lumovibe/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Страница ссылки «Поделиться» из LumoVibe: https://<сайт>/listen/?v=<id YouTube>&t=<название>.
       Если LumoVibe установлен, Android открывает такую ссылку сразу в приложении (App Links,
       см. /.well-known/assetlinks.json), и эту страницу человек не видит. */
    :root {
      --bg: #09090b;
      --card: #0d0d0f;
      --border: #27272a;
      --fg: #fafafa;
      --muted: #a1a1aa;
      --pink: #ff4f8b;
      --violet: #2a1352;
      --font-head: "Space Grotesk", "Noto Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: radial-gradient(120% 80% at 50% 0%, #3b1a6e 0%, var(--violet) 35%, var(--bg) 75%);
      color: var(--fg);
      font-family: "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 28px 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: color-mix(in srgb, var(--card) 82%, transparent);
      backdrop-filter: blur(16px);
      text-align: center;
    }
    .cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      object-fit: cover;
      background: #18181b;
      box-shadow: 0 20px 60px -20px var(--pink);
    }
    h1 {
      margin: 20px 0 4px;
      font-family: var(--font-head);
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }
    .artist { margin: 0; color: var(--muted); }
    .buttons { display: grid; gap: 10px; margin-top: 24px; }
    .btn {
      display: block;
      padding: 13px 16px;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      color: var(--fg);
      border: 1px solid var(--border);
      transition: transform .15s ease, background .15s ease;
    }
    .btn:hover { transform: translateY(-1px); background: #18181b; }
    .btn-primary { background: var(--pink); border-color: var(--pink); color: #12020a; }
    .btn-primary:hover { background: #ff6b9e; }
    .brand { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; color: var(--muted); font-size: 13px; text-decoration: none; }
    .brand img { width: 20px; height: 20px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <img class="cover" id="cover" alt="">
    <h1 id="title">LumoVibe</h1>
    <p class="artist" id="artist"></p>
    <div class="buttons">
      <a class="btn btn-primary" id="open" hidden></a>
      <a class="btn" id="youtube" target="_blank" rel="noopener"></a>
      <a class="btn" id="get" href="../#/project/lumovibe"></a>
    </div>
    <a class="brand" href="../#/">
      <img src="../assets/projects/lumovibe/icon.svg" alt="">
      <span id="tagline"></span>
    </a>
  </main>
  <script>
    (function () {
      var ru = /^(ru|uk|be|kk)\b/i.test(navigator.language || "");
      var t = function (r, e) { return ru ? r : e; };
      var params = new URLSearchParams(location.search);
      var id = (params.get("v") || "").replace(/[^\w-]/g, "").slice(0, 32);
      var title = params.get("t") || "";

      document.documentElement.lang = ru ? "ru" : "en";
      document.getElementById("get").textContent = t("Скачать LumoVibe бесплатно", "Get LumoVibe for free");
      document.getElementById("tagline").textContent = t("LumoVibe — музыкальный плеер от Tiny Tide", "LumoVibe — a music player by Tiny Tide");

      var yt = document.getElementById("youtube");
      if (!id) {
        document.getElementById("cover").hidden = true;
        yt.hidden = true;
        document.getElementById("title").textContent = t("Ссылка без трека", "This link has no track");
        return;
      }
      var watch = "https://music.youtube.com/watch?v=" + id;
      yt.href = watch;
      yt.textContent = t("Слушать на YouTube Music", "Listen on YouTube Music");
      document.getElementById("cover").src = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
      if (title) document.title = title + " — LumoVibe";
      document.getElementById("title").textContent = title || t("Трек", "Track");

      // Android: открыть в приложении, а если его нет — страницу LumoVibe на сайте.
      if (/Android/i.test(navigator.userAgent)) {
        var fallback = location.origin + "/#/project/lumovibe";
        var open = document.getElementById("open");
        open.href = "intent://" + location.host + "/listen/?v=" + id +
          "#Intent;scheme=https;package=app.bestplayer;S.browser_fallback_url=" + encodeURIComponent(fallback) + ";end";
        open.textContent = t("Открыть в LumoVibe", "Open in LumoVibe");
        open.hidden = false;
      }

      // Название и исполнитель, если их нет в ссылке (noembed отдаёт данные YouTube с CORS).
      fetch("https://noembed.com/embed?url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!title && d.title) {
            document.getElementById("title").textContent = d.title;
            document.title = d.title + " — LumoVibe";
          }
          if (d.author_name) document.getElementById("artist").textContent = d.author_name.replace(/ - Topic$/, "");
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
